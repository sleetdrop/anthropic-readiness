name: CI
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    env:
      UV_PYTHON: ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare locked environment
        run: |
          python -m pip install uv==0.13.1
          uv sync --locked --python '${{ matrix.python }}'
      - name: Prepare locked Node and Chromium
        run: |
          python scripts/prepare_frontend.py
      - name: Prepare browser and OS libraries
        run: npx --no-install playwright install --with-deps chromium
      - name: Offline full graph
        env:
          UV_OFFLINE: '1'
        run: uv run --frozen python scripts/check.py --suite full
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: checks-${{ github.sha }}-py${{ matrix.python }}-amd64
          path: artifacts/checks/
          if-no-files-found: error
  devcontainer:
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use actual Dev Container configuration
        run: |
          npm install --global @devcontainers/cli@0.89.0
          devcontainer up --workspace-folder .
          devcontainer exec --workspace-folder . env UV_OFFLINE=1 uv run --frozen python scripts/check.py --suite full
  runtime-amd64:
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: CLI and Web image smoke (full matrix is separate)
        run: python3 scripts/check_images.py --platform linux/amd64 --scope smoke --targets runtime,web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: runtime-${{ github.sha }}-amd64
          path: artifacts/images/
          if-no-files-found: error
  ci-required:
    if: always() && (github.event_name != 'push' || github.ref_name == github.event.repository.default_branch)
    needs: [quality, devcontainer, runtime-amd64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every child job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci_required.py --required quality devcontainer runtime-amd64
