name: Container matrix
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: read
concurrency:
  group: container-matrix-${{ github.ref }}
  cancel-in-progress: false
jobs:
  images:
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: python3 scripts/check_images.py --platform '${{ matrix.platform }}' --targets runtime,web
      - name: Summarize recorded evidence
        if: always()
        run: python3 scripts/ci_summary.py >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: images-${{ github.sha }}-${{ matrix.arch }}
          path: |
            artifacts/images/
            artifacts/checks/
          if-no-files-found: error
          retention-days: 14
