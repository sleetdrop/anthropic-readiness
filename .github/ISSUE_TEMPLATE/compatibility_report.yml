name: Compatibility report
description: Report an observed Anthropic API difference
body:
  - type: markdown
    attributes:
      value: "Use a synthetic reproduction. Do not attach credentials, private endpoint URLs, or original service logs."
  - type: textarea
    id: setup
    attributes:
      label: Tested setup
      description: "Public component names and versions, API header, selected probes, and capture completeness. Leave unknown details explicit."
    validations:
      required: true
  - type: textarea
    id: finding
    attributes:
      label: Observed difference
      description: "Expected and actual behavior, rule or case ID, and the relevant JSON field or SSE event index."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction and checks
      description: "A minimal example and the checks actually run. Distinguish protocol, task, and client outcomes."
    validations:
      required: true
