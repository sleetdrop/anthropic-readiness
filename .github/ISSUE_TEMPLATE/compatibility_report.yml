name: Compatibility report
description: Share a scoped endpoint observation
body:
  - type: markdown
    attributes:
      value: "Use public IDs and synthetic data. Never attach credentials, private endpoints, original logs or private chats. unknown/not_run are valid."
  - type: textarea
    id: context
    attributes:
      label: Context and outcome
      description: "User symptom, expected and observed behavior, model alias, request API version, betas and capture completeness"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Validation evidence
      description: "Checks run, versions, sanitized reproduction and remaining unknown or not_run checks. See CONTRIBUTING.md."
    validations:
      required: true
  - type: textarea
    id: location
    attributes:
      label: Evidence location
      description: "Relevant event index or JSON field, applicable rule ID, and a synthetic excerpt that reproduces the finding"
    validations:
      required: true
  - type: textarea
    id: repair_comparison
    attributes:
      label: Repair verification, when applicable
      description: "Compare the same request and relevant observation before and after the change"
    validations:
      required: false
