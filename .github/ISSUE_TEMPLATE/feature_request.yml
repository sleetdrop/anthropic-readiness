name: Feature request
description: Suggest an improvement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: "What are you trying to do, and what prevents it today?"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: "Describe the useful outcome and any alternatives considered."
    validations:
      required: true
