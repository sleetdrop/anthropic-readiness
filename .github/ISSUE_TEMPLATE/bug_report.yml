name: Bug report
description: Report a problem with the command, checks, or reports
body:
  - type: markdown
    attributes:
      value: "Use a synthetic example. Do not include credentials, private URLs, or unredacted logs."
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: "Commands or inputs, package and Node versions, and relevant operating system or agent details."
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual results
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Checks or workarounds tried
    validations:
      required: false
