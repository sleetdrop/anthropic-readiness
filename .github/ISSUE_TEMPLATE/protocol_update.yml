name: Protocol update
description: Propose a rule or probe change
body:
  - type: textarea
    id: contract
    attributes:
      label: Contract change
      description: "Link the official source and name the API version or capability affected."
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected behavior and coverage
      description: "Describe the rule difference and the normal and faulty controls needed to verify it. Use synthetic data."
    validations:
      required: true
