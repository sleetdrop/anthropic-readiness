[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "anthropic-readiness"
version = "0.1.0"
description = "Evidence-led black-box checks for Anthropic-compatible endpoints"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "jsonschema>=4.23,<5", "PyYAML>=6,<7"]

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "jinja2>=3.1,<4"]

[project.scripts]
anthropic-readiness = "anthropic_readiness.cli:main"

[dependency-groups]
build = ["hatchling==1.27.0"]
dev = ["pytest>=8,<10", "pytest-cov>=6", "mypy>=1.15", "ruff>=0.11", "import-linter>=2", "types-PyYAML", "types-jsonschema", "hatchling==1.27.0", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "jinja2>=3.1,<4"]

[tool.hatch.build.targets.wheel]
packages = ["src/anthropic_readiness"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4", "RUF", "PT"]
# These characters are intentional punctuation in the Simplified Chinese reports.
allowed-confusables = ["，", "；", "：", "（", "）", "／", "。"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib"]
filterwarnings = ["error"]
markers = ["integration: isolated synthetic HTTP integration", "live: explicit real endpoint tests"]

[tool.importlinter]
root_package = "anthropic_readiness"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Application dependency direction"
type = "layers"
layers = [
  "anthropic_readiness.cli",
  "anthropic_readiness.runner | anthropic_readiness.reporting",
  "anthropic_readiness.evidence | anthropic_readiness.transport | anthropic_readiness.cases | anthropic_readiness.contracts | anthropic_readiness.context",
  "anthropic_readiness.config",
  "anthropic_readiness.schema | anthropic_readiness.validation.stream",
  "anthropic_readiness.validation.messages",
  "anthropic_readiness.json_validation | anthropic_readiness.sse | anthropic_readiness.requirements | anthropic_readiness.report_reading",
  "anthropic_readiness.models",
]

[[tool.importlinter.contracts]]
name = "Operational values and ports stay independent of adapters"
type = "forbidden"
source_modules = ["anthropic_readiness.operations.models", "anthropic_readiness.operations.ports", "anthropic_readiness.operations.reduction"]
forbidden_modules = ["anthropic_readiness.schema", "anthropic_readiness.config", "anthropic_readiness.operations.contracts", "anthropic_readiness.evidence", "pathlib", "importlib", "httpx", "fastapi", "sqlite3"]

[[tool.importlinter.contracts]]
name = "Pure domain, framing and validation"
type = "forbidden"
source_modules = ["anthropic_readiness.models", "anthropic_readiness.sse", "anthropic_readiness.validation", "anthropic_readiness.json_validation", "anthropic_readiness.requirements", "anthropic_readiness.report_reading"]
forbidden_modules = ["anthropic_readiness.schema", "anthropic_readiness.config", "anthropic_readiness.contracts", "anthropic_readiness.transport", "anthropic_readiness.evidence", "anthropic_readiness.runner", "anthropic_readiness.reporting", "anthropic_readiness.context", "anthropic_readiness.cli", "httpx", "yaml", "pathlib", "importlib"]
