{% extends 'base.html' %}{% block content %}<header class="page-title"><h1>{{ t('import.title') }}</h1><p class="lead">{{ t('import.intro') }}</p></header><section class="import-layout"><form id="import-form" class="flat-panel"><label for="import-file">{{ t('import.file') }}</label><input type="file" id="import-file" accept=".zip,application/zip" required /><p class="field-note">{{ t('import.note') }}</p><button type="submit" id="preview-import">{{ t('import.preview') }}</button><div id="import-preview" role="status"></div><button type="button" id="commit-import" disabled>{{ t('import.commit') }}</button></form><section class="flat-panel"><h2>{{ t('import.saved') }}</h2><ul class="baseline-list">{% for option in baseline_options %}<li><a href="/baselines/{{ option.value.split(':')[-1] }}">{{ option.label }}</a></li>{% else %}<li>{{ t('import.none') }}</li>{% endfor %}</ul></section></section>{% endblock %}
